name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: ron-x86_64-linux.tar.gz
          - os: macos-latest
            archive: ron-aarch64-macos.tar.gz
          - os: windows-latest
            archive: ron-x86_64-windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/release ron
      - name: Archive (windows)
        if: runner.os == 'Windows'
        run: 7z a ${{ matrix.archive }} ./target/release/ron.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
